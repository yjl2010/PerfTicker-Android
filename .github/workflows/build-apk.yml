name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK dir = $SDK"
          ls "$SDK" || true
          SDKMGR="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found, downloading cmdline-tools ..."
            curl -fsSL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
            mkdir -p "$SDK/cmdline-tools/latest"
            mv "$RUNNER_TEMP/clt/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager = $SDKMGR"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install SDK components
        run: |
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate signing key
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/perfticker.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias perfticker \
            -storepass perfticker -keypass perfticker \
            -dname "CN=PerfTicker, OU=QiuSui_Studio, O=QiuSui_Studio, L=Guilin, ST=Guangxi, C=CN"

      - name: Build APK
        env:
          PT_KEYSTORE: ${{ github.workspace }}/app/keystore/perfticker.jks
          PT_STORE_PASS: perfticker
          PT_KEY_ALIAS: perfticker
          PT_KEY_PASS: perfticker
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfTicker-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
